name: NovaPay 8-Stage Bank CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # 1. BUILD & UNIT TEST
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build App
        run: |
          echo "Stage 1: Building NovaPay App..."
          # docker build -t novapay:${{ github.sha }} ./app

  # 2. SAST (Static Analysis)
  sast:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run SAST Scan
        run: |
          echo "Stage 2: Running SonarQube SAST..."

  # 3. DEPENDENCY SCAN (Trivy FS)
  dependency-scan:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'

  # 4. CONTAINER BUILD
  container-build:
    needs: [sast, dependency-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Docker Build
        run: |
          echo "Stage 4: Building Container Image..."

  # 5. CONTAINER SCAN (Trivy Image)
  container-scan:
    needs: container-build
    runs-on: ubuntu-latest
    steps:
      - name: Trivy Image Scan
        run: |
          echo "Stage 5: Scanning Image for CVEs..."

  # 6. POLICY GATE (OPA/Kyverno)
  policy-gate:
    needs: container-scan
    runs-on: ubuntu-latest
    steps:
      - name: OPA Compliance Check
        run: |
          echo "Stage 6: Checking K8s manifests against RBI/PCI-DSS rules..."

  # 7. DEPLOY TO EKS
  deploy:
    needs: policy-gate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EKS
        run: |
          echo "Stage 7: Deploying to production cluster (Blue-Green/Canary)..."

  # 8. POST DEPLOY HEALTH CHECK
  post-deploy:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verification Smoke Test
        run: |
          echo "Stage 8: Verifying Service Health..."
          # curl -f https://api.novapay.com/health
