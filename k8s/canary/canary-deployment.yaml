apiVersion: apps/v1
kind: Deployment
metadata:
  name: novapay-canary
  labels:
    app: novapay
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novapay
      track: canary
  template:
    metadata:
      labels:
        app: novapay
        track: canary
    spec:
      containers:
        - name: novapay
          image: novapay:canary
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
