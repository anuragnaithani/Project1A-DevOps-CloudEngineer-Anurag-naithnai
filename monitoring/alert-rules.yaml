groups:
- name: novapay-alerts
  rules:

  - alert: HighErrorRate
    expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: High HTTP 5xx error rate detected

  - alert: HighLatency
    expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 0.5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: p99 latency exceeded threshold

  - alert: HighCPUUsage
    expr: container_cpu_usage_seconds_total > 0.9
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: CPU utilization above 90%

  - alert: HighMemoryUsage
    expr: container_memory_usage_bytes > 0.85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Memory utilization above 85%
