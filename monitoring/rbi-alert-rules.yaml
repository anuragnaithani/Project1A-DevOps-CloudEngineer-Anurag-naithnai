groups:
- name: rbi-compliance-alerts
  rules:

  - alert: DeploymentFailure
    expr: increase(kube_pod_container_status_restarts_total[5m]) > 3
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Frequent pod restart detected

  - alert: AvailabilityRisk
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: Service availability risk

  - alert: ErrorBudgetBurn
    expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.02
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Error budget burn detected
