apiVersion: apps/v1
kind: Deployment
metadata:
  name: novapay-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novapay
  template:
    metadata:
      labels:
        app: novapay
    spec:
      containers:
      - name: novapay-container
        image: 431412299857.dkr.ecr.us-east-1.amazonaws.com/novapay:latest
        ports:
        - containerPort: 80
